<text x="56" y="184.4" font-size="20" font-weight="700" fill="#E8EDF3">Your application</text>
<text x="56" y="215" font-size="17" fill="#D2DAE4">servo control, LED dimming, motor speed ...</text>
<rect x="48" y="323.4" width="167" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="56" y="341.5" font-size="16" font-weight="700" fill="#C7CBFF">EnsureInitialized()</text>
<rect x="223" y="323.4" width="75.8" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="231" y="341.5" font-size="16" font-weight="700" fill="#C7CBFF">Reset()</text>
<rect x="306.8" y="323.4" width="134.7" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="314.8" y="341.5" font-size="16" font-weight="700" fill="#C7CBFF">SetPwmFreq()</text>
