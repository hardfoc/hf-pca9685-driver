<rect x="922.9" y="323.4" width="75.4" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="930.9" y="341.5" font-size="16" font-weight="700" fill="#C7CBFF">Sleep()</text>
<rect x="1006.3" y="323.4" width="76.2" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="1014.3" y="341.5" font-size="16" font-weight="700" fill="#C7CBFF">Wake()</text>
<rect x="48" y="357.4" width="162.2" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="56" y="375.5" font-size="16" font-weight="700" fill="#C7CBFF">SetOutputInvert()</text>
<rect x="218.2" y="357.4" width="211.4" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="226.2" y="375.5" font-size="16" font-weight="700" fill="#C7CBFF">SetOutputDriverMode()</text>
<rect x="437.6" y="357.4" width="178.3" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="445.6" y="375.5" font-size="16" font-weight="700" fill="#C7CBFF">SetChannelFullOn()</text>
<rect x="624" y="357.4" width="181.2" height="26" rx="13" fill="#1C1F3D" stroke="#3B4080" stroke-width="1"/>
<text x="632" y="375.5" font-size="16" font-weight="700" fill="#C7CBFF">SetChannelFullOff()</text>
<text x="48" y="307.4" font-size="17" font-weight="700" fill="#C7CBFF">HARDWARE-AGNOSTIC CORE</text>
<text x="326.2" y="307.4" font-size="16" fill="#C7CBFF">PCA9685&lt;I2cType&gt;, inc/pca9685.hpp</text>
<text x="56" y="476.4" font-size="20" font-weight="700" fill="#C7CBFF">Communication interface</text>
<text x="56" y="507" font-size="17" fill="#D2DAE4">I2cInterface&lt;Derived&gt;: CRTP base, register reads and writes resolved at compile time,</text>
<text x="56" y="531.7" font-size="17" fill="#D2DAE4">retries and error flags in the driver above it</text>
<text x="56" y="630.4" font-size="20" font-weight="700" fill="#A7F3E6">Platform port (your class)</text>
<text x="56" y="659.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">EnsureInitialized()  Write()  Read()</text>
<text x="56" y="758.4" font-size="20" font-weight="700" fill="#E8EDF3">PCA9685</text>
<text x="56" y="789" font-size="17" fill="#D2DAE4">I2C up to 1 MHz (Fm+), address 0x40 to 0x7F  /  LED0 to LED15, OE</text>
<rect x="32" y="824.8" width="14" height="14" rx="4" fill="#1C1F3D" stroke="#8C93FF" stroke-width="1.4"/>
<text x="54" y="839.4" font-size="16" fill="#9AA6B5">this library</text>
<rect x="161.8" y="824.8" width="14" height="14" rx="4" fill="#0F2A28" stroke="#2DD4BF" stroke-width="1.4"/>
<text x="183.8" y="839.4" font-size="16" fill="#9AA6B5">you write</text>
<rect x="282.1" y="824.8" width="14" height="14" rx="4" fill="#1B232E" stroke="#94A3B8" stroke-width="1.4"/>
<text x="304.1" y="839.4" font-size="16" fill="#9AA6B5">hardware</text>
</svg>
