<text x="793.1" y="341.5" font-size="16" font-weight="700" fill="#3730A3">GetPrescale()</text>
<rect x="922.9" y="323.4" width="75.4" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="930.9" y="341.5" font-size="16" font-weight="700" fill="#3730A3">Sleep()</text>
<rect x="1006.3" y="323.4" width="76.2" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="1014.3" y="341.5" font-size="16" font-weight="700" fill="#3730A3">Wake()</text>
<rect x="48" y="357.4" width="162.2" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="56" y="375.5" font-size="16" font-weight="700" fill="#3730A3">SetOutputInvert()</text>
<rect x="218.2" y="357.4" width="211.4" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="226.2" y="375.5" font-size="16" font-weight="700" fill="#3730A3">SetOutputDriverMode()</text>
<rect x="437.6" y="357.4" width="169.6" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="445.6" y="375.5" font-size="16" font-weight="700" fill="#3730A3">SetOutputEnable()</text>
<rect x="615.3" y="357.4" width="178.3" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="623.3" y="375.5" font-size="16" font-weight="700" fill="#3730A3">SetChannelFullOn()</text>
<rect x="801.6" y="357.4" width="181.2" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="809.6" y="375.5" font-size="16" font-weight="700" fill="#3730A3">SetChannelFullOff()</text>
<text x="48" y="307.4" font-size="17" font-weight="700" fill="#3730A3">HARDWARE-AGNOSTIC CORE</text>
<text x="326.2" y="307.4" font-size="16" fill="#3730A3">PCA9685&lt;I2cType&gt;, inc/pca9685.hpp</text>
<text x="56" y="476.4" font-size="20" font-weight="700" fill="#3730A3">Communication interface</text>
<text x="56" y="507" font-size="17" fill="#2B3442">I2cInterface&lt;Derived&gt;: CRTP base, register reads and writes resolved at compile time,</text>
<text x="56" y="531.7" font-size="17" fill="#2B3442">retries and error flags in the driver above it</text>
<text x="56" y="630.4" font-size="20" font-weight="700" fill="#115E59">Platform port (your class)</text>
<text x="56" y="659.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">EnsureInitialized()  Write()  Read()</text>
<text x="56" y="758.4" font-size="20" font-weight="700" fill="#17202C">PCA9685</text>
<text x="56" y="789" font-size="17" fill="#2B3442">I2C up to 1 MHz (Fm+), address 0x40 to 0x7F  /  LED0 to LED15, OE</text>
<rect x="32" y="824.8" width="14" height="14" rx="4" fill="#EEF0FF" stroke="#4F46E5" stroke-width="1.4"/>
<text x="54" y="839.4" font-size="16" fill="#566070">this library</text>
<rect x="161.8" y="824.8" width="14" height="14" rx="4" fill="#E6F6F4" stroke="#0F8B80" stroke-width="1.4"/>
<text x="183.8" y="839.4" font-size="16" fill="#566070">you write</text>
<rect x="282.1" y="824.8" width="14" height="14" rx="4" fill="#F1F4F8" stroke="#64748B" stroke-width="1.4"/>
<text x="304.1" y="839.4" font-size="16" fill="#566070">hardware</text>
</svg>
