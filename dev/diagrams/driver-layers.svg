<rect x="32" y="731.4" width="4" height="73" rx="2" fill="#64748B"/>
<text x="56" y="184.4" font-size="20" font-weight="700" fill="#17202C">Your application</text>
<text x="56" y="215" font-size="17" fill="#2B3442">servo control, LED dimming, motor speed ...</text>
<rect x="48" y="323.4" width="167" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="56" y="341.5" font-size="16" font-weight="700" fill="#3730A3">EnsureInitialized()</text>
<rect x="223" y="323.4" width="75.8" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="231" y="341.5" font-size="16" font-weight="700" fill="#3730A3">Reset()</text>
<rect x="306.8" y="323.4" width="134.7" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="314.8" y="341.5" font-size="16" font-weight="700" fill="#3730A3">SetPwmFreq()</text>
<rect x="449.6" y="323.4" width="97.1" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="457.6" y="341.5" font-size="16" font-weight="700" fill="#3730A3">SetPwm()</text>
<rect x="554.7" y="323.4" width="95.4" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="562.7" y="341.5" font-size="16" font-weight="700" fill="#3730A3">SetDuty()</text>
<rect x="658.1" y="323.4" width="118.9" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
